<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPilot AI — Your Personalized AI Wealth Mentor</title>
  <meta name="description" content="Before helping people invest money, help them understand money.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script>window.React || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>')</script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>window.ReactDOM || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>')</script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>window.Babel || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"><\/script>')</script>
  <style>
    /* ==========================================================================
       FINPILOT AI FINTECH DESIGN SYSTEM — LIGHT & DARK THEMES
       ========================================================================== */
    :root {
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Base Metrics */
      --sidebar-w: 240px;
      --watchlist-w: 290px;
      --topbar-h: 56px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-pill: 9999px;
      
      /* Transition */
      --transition-fast: 0.15s ease;
    }

    /* Dark Theme (Default - Terminal/Pro Fintech) */
    html[data-theme="dark"] {
      --bg-canvas: #090D16;
      --bg-surface: #0F1626;
      --bg-surface-elevated: #151F33;
      --bg-surface-subtle: #1A263D;
      --bg-input: #121B2D;
      
      --border-subtle: #1B283F;
      --border-strong: #253654;
      --border-focus: #D97706;
      
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-inverse: #090D16;
      
      /* Fintech Palette */
      --accent-gold: #F59E0B;
      --accent-gold-hover: #D97706;
      --accent-gold-dim: rgba(245, 158, 11, 0.12);
      --accent-gold-border: rgba(245, 158, 11, 0.28);
      
      --fin-pos: #10B981;
      --fin-pos-dim: rgba(16, 185, 129, 0.12);
      --fin-neg: #EF4444;
      --fin-neg-dim: rgba(239, 68, 68, 0.12);
      
      --fin-blue: #3B82F6;
      --fin-blue-dim: rgba(59, 130, 246, 0.12);
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Light Theme (Clean Modern Fintech) */
    html[data-theme="light"] {
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-elevated: #F1F5F9;
      --bg-surface-subtle: #E2E8F0;
      --bg-input: #FFFFFF;
      
      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      --border-focus: #D97706;
      
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --text-inverse: #FFFFFF;
      
      --accent-gold: #D97706;
      --accent-gold-hover: #B45309;
      --accent-gold-dim: rgba(217, 119, 6, 0.1);
      --accent-gold-border: rgba(217, 119, 6, 0.25);
      
      --fin-pos: #059669;
      --fin-pos-dim: rgba(5, 150, 105, 0.1);
      --fin-neg: #DC2626;
      --fin-neg-dim: rgba(220, 38, 38, 0.1);
      
      --fin-blue: #2563EB;
      --fin-blue-dim: rgba(37, 99, 235, 0.1);
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    /* Reset & Typography */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    
    /* Financial tabular figures */
    .num, .tabular { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); }

    button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: transparent; }

    /* ==========================================================================
       APP SHELL LAYOUT (Three-Part Desktop)
       ========================================================================== */
    .app-layout {
      display: flex;
      min-height: 100vh;
      background-color: var(--bg-canvas);
    }

    /* 1. LEFT SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform var(--transition-fast);
    }
    .sidebar-brand {
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background-color: var(--accent-gold);
      color: #000;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .brand-tagline {
      font-size: 0.68rem;
      color: var(--text-muted);
      display: block;
      line-height: 1.3;
      margin-top: 1px;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.5rem;
    }
    .sidebar-section-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.75rem 0.75rem 0.35rem;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.48rem 0.75rem;
      margin-bottom: 2px;
      border-radius: var(--radius-md);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      text-align: left;
    }
    .nav-btn:hover {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
    }
    .nav-btn.active {
      background-color: var(--accent-gold-dim);
      color: var(--accent-gold);
      font-weight: 600;
      border-left: 2px solid var(--accent-gold);
    }
    .nav-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.8;
      flex-shrink: 0;
    }
    .nav-badge {
      margin-left: auto;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-surface-subtle);
      color: var(--text-secondary);
      font-weight: 600;
    }
    .nav-btn.active .nav-badge {
      background-color: var(--accent-gold);
      color: #000;
    }

    .sidebar-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-pill);
      background-color: var(--accent-gold);
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .user-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.8rem;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 2. MARKET WATCHLIST (Column 2) */
    .watchlist-col {
      width: var(--watchlist-w);
      min-width: var(--watchlist-w);
      height: 100vh;
      position: fixed;
      top: 0;
      left: var(--sidebar-w);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: width var(--transition-fast), transform var(--transition-fast);
    }
    .watchlist-col.collapsed {
      width: 0;
      min-width: 0;
      transform: translateX(-100%);
      overflow: hidden;
    }
    .watchlist-header {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .watchlist-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .watchlist-search-box {
      padding: 0.5rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .watchlist-search-input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.4rem 0.65rem 0.4rem 2rem;
      font-size: 0.8rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .watchlist-search-input:focus {
      border-color: var(--border-focus);
    }
    .watchlist-search-icon {
      position: absolute;
      left: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .watchlist-items {
      flex: 1;
      overflow-y: auto;
    }
    .wl-item {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color var(--transition-fast);
    }
    .wl-item:hover {
      background-color: var(--bg-surface-elevated);
    }
    .wl-item.active {
      background-color: var(--bg-surface-subtle);
      border-left: 2px solid var(--accent-gold);
    }
    .wl-symbol {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .wl-tag-index {
      font-size: 0.62rem;
      background-color: var(--bg-surface-subtle);
      color: var(--text-muted);
      padding: 1px 4px;
      border-radius: 2px;
      font-weight: 600;
    }
    .wl-name {
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }
    .wl-price-col {
      text-align: right;
    }
    .wl-price {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .wl-change {
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 1px;
    }

    /* 3. MAIN CONTENT AREA */
    .main-wrap {
      flex: 1;
      margin-left: calc(var(--sidebar-w) + var(--watchlist-w));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left var(--transition-fast);
    }
    .main-wrap.watchlist-collapsed {
      margin-left: var(--sidebar-w);
    }

    /* TOP BAR */
    .topbar {
      height: var(--topbar-h);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .topbar-btn-toggle {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.32rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface-elevated);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .topbar-btn-toggle:hover {
      background-color: var(--bg-surface-subtle);
      color: var(--text-primary);
    }
    .topbar-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .market-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-open {
      background-color: var(--fin-pos-dim);
      color: var(--fin-pos);
    }
    .status-open .status-dot { background-color: var(--fin-pos); box-shadow: 0 0 6px var(--fin-pos); }
    .status-closed {
      background-color: var(--bg-surface-subtle);
      color: var(--text-muted);
    }
    .status-closed .status-dot { background-color: var(--text-muted); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .iq-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background-color: var(--accent-gold-dim);
      border: 1px solid var(--accent-gold-border);
      color: var(--accent-gold);
      padding: 0.28rem 0.7rem;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition-fast);
    }
    .iq-chip:hover { opacity: 0.88; }
    .theme-toggle-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .theme-toggle-btn:hover {
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .main-body {
      flex: 1;
      padding: 1.5rem;
      max-width: 1440px;
      width: 100%;
    }

    /* Positive / Negative Colors */
    .pos { color: var(--fin-pos) !important; }
    .neg { color: var(--fin-neg) !important; }
    .neu { color: var(--text-secondary) !important; }

    /* ==========================================================================
       FINTECH UI COMPONENTS (Cards, Tables, Grids, Charts, Buttons)
       ========================================================================== */
    .panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }
    .panel-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.95rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .btn-gold {
      background-color: var(--accent-gold);
      color: #000;
    }
    .btn-gold:hover { background-color: var(--accent-gold-hover); }
    .btn-outline {
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      background-color: transparent;
    }
    .btn-outline:hover {
      background-color: var(--bg-surface-elevated);
    }
    .btn-subtle {
      background-color: var(--bg-surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }
    .btn-subtle:hover {
      background-color: var(--bg-surface-subtle);
      color: var(--text-primary);
    }
    .btn-sm {
      padding: 0.28rem 0.6rem;
      font-size: 0.74rem;
    }

    /* Form Controls */
    .form-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
    }
    .form-input, .form-select {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.5rem 0.75rem;
      font-size: 0.84rem;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--border-focus);
    }

    /* Grids */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

    /* Key Stat Metric Box */
    .stat-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
    }
    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .stat-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .stat-footer {
      font-size: 0.72rem;
      margin-top: 0.25rem;
      color: var(--text-muted);
    }

    /* Professional Data Table */
    .fin-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }
    .fin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
      text-align: left;
    }
    .fin-table th {
      background-color: var(--bg-surface-elevated);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .fin-table td {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }
    .fin-table tr:last-child td { border-bottom: none; }
    .fin-table tr:hover td {
      background-color: var(--bg-surface-elevated);
    }

    /* Segmented Control / Pill Switcher */
    .segmented-control {
      display: inline-flex;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 2px;
      gap: 2px;
    }
    .segmented-btn {
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .segmented-btn:hover { color: var(--text-primary); }
    .segmented-btn.active {
      background-color: var(--bg-surface);
      color: var(--accent-gold);
      box-shadow: var(--shadow-sm);
    }

    /* Alerts & Disclaimers */
    .fin-alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      line-height: 1.5;
    }
    .fin-alert-gold {
      background-color: var(--accent-gold-dim);
      border: 1px solid var(--accent-gold-border);
      color: var(--accent-gold);
    }
    .fin-alert-blue {
      background-color: var(--fin-blue-dim);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: var(--fin-blue);
    }
    .fin-alert-green {
      background-color: var(--fin-pos-dim);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--fin-pos);
    }

    /* Modal Backdrop */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-head {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-body { padding: 1.25rem; }
    .modal-foot {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    /* ==========================================================================
       PLANNING MODE STYLES (GUIDE VS SOLO)
       ========================================================================== */
    .planning-style-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .mode-card {
      background-color: var(--bg-surface);
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .mode-card:hover {
      border-color: var(--accent-gold-border);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .mode-card.selected {
      border-color: var(--accent-gold);
      background-color: var(--bg-surface);
      box-shadow: 0 0 0 1px var(--accent-gold), var(--shadow-sm);
    }
    .mode-card-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-pill);
      display: inline-block;
      margin-bottom: 0.6rem;
      width: fit-content;
    }
    .mode-badge-guide {
      background-color: var(--accent-gold-dim);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold-border);
    }
    .mode-badge-solo {
      background-color: var(--fin-blue-dim);
      color: var(--fin-blue);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .mode-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mode-card-tagline {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }
    .mode-card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .mode-card-features {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
      font-size: 0.76rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .mode-card-features li {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .mode-check-icon {
      color: var(--fin-pos);
      font-weight: 800;
    }

    /* Topbar Mode Indicator Pill */
    .mode-indicator-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-surface-elevated);
      color: var(--text-primary);
      transition: all var(--transition-fast);
      user-select: none;
    }
    .mode-indicator-pill:hover {
      border-color: var(--accent-gold);
      background-color: var(--bg-surface);
    }
    .mode-indicator-pill.mode-guide {
      border-color: var(--accent-gold-border);
      background-color: var(--accent-gold-dim);
      color: var(--accent-gold);
    }
    .mode-indicator-pill.mode-solo {
      border-color: rgba(59, 130, 246, 0.3);
      background-color: var(--fin-blue-dim);
      color: var(--fin-blue);
    }
    .mode-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* Sidebar Mode Box */
    .sidebar-mode-box {
      margin: 0.75rem 1rem;
      padding: 0.75rem;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    /* Risk Awareness Banner */
    .risk-disclosure-banner {
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-gold);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .risk-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--fin-neg);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .assumption-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--fin-blue);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    /* Stock Trading 3-Column Layout */
    .stock-trading-layout {
      display: grid;
      grid-template-columns: 270px 1fr 300px;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 1200px) {
      .stock-trading-layout {
        grid-template-columns: 260px 1fr;
      }
      .stock-trading-summary-col {
        grid-column: span 2;
      }
    }
    @media (max-width: 860px) {
      .stock-trading-layout {
        grid-template-columns: 1fr;
      }
      .stock-trading-summary-col {
        grid-column: span 1;
      }
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .watchlist-col { display: none; }
      .main-wrap { margin-left: var(--sidebar-w); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0 !important; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const API_BASE = (window.location.protocol === 'http:' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'))
      ? `${window.location.protocol}//${window.location.hostname}:8000`
      : '';

    // Format currency helpers
    const fmtINR = (val) => {
      if (val === undefined || val === null || isNaN(val) || !isFinite(val)) return '₹—';
      const num = Number(val);
      const sign = num < 0 ? '-' : '';
      return sign + '₹' + Math.abs(num).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    };
    const fmtCompact = (num) => {
      if (num === undefined || num === null || isNaN(num) || !isFinite(num)) return '₹—';
      const abs = Math.abs(Number(num));
      const sign = Number(num) < 0 ? '-' : '';
      if (abs >= 10000000) return sign + '₹' + (abs / 10000000).toFixed(2) + ' Cr';
      if (abs >= 100000) return sign + '₹' + (abs / 100000).toFixed(1) + ' L';
      return sign + '₹' + abs.toLocaleString('en-IN');
    };

      Settings: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
      Search: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,

    // ==========================================================================
    // INTERACTIVE FINANCIAL CHART (Candlestick, Line, Bar + Volume + Crosshair)
    // ==========================================================================
    function StockChart({ candles, chartType, onTypeChange }) {
      const [hoveredIndex, setHoveredIndex] = useState(null);
      const containerRef = useRef(null);

      if (!candles || candles.length === 0) {
        return (
          <div style={{ height: '340px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>
            Loading market chart data...
          </div>
        );
      }

      // Dimensions
      const width = 820;
      const height = 340;
      const padTop = 15;
      const padBottom = 60; // price + volume area
      const padLeft = 10;
      const padRight = 65; // Price scale

      const priceHeight = height - padBottom - padTop;
      const volHeight = 45;
      const volTop = height - volHeight - 15;

      // Price limits
      const pricesHigh = Math.max(...candles.map(c => c.high));
      const pricesLow = Math.min(...candles.map(c => c.low));
      const priceRange = pricesHigh - pricesLow || 1;

      // Volume limits
      const maxVol = Math.max(...candles.map(c => c.volume || 0)) || 1;

      const n = candles.length;
      const step = (width - padLeft - padRight) / (n - 1 || 1);

      const getY = (price) => {
        return padTop + priceHeight - ((price - pricesLow) / priceRange) * priceHeight;
      };

      const getX = (idx) => {
        return padLeft + idx * step;
      };

      // Hover tracking
      const handleMouseMove = (e) => {
        if (!containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const svgX = (clientX / rect.width) * width;
        const idx = Math.round((svgX - padLeft) / step);
        if (idx >= 0 && idx < n) {
          setHoveredIndex(idx);
        }
      };

      const handleMouseLeave = () => {
        setHoveredIndex(null);
      };

      const activeCandle = hoveredIndex !== null ? candles[hoveredIndex] : candles[candles.length - 1];
      const isUp = activeCandle ? activeCandle.close >= activeCandle.open : true;

      // Build path for Line chart
      const linePath = candles.reduce((acc, c, i) => {
        const x = getX(i);
        const y = getY(c.close);
        return i === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
      }, '');

      // Area path for gradient below line
      const areaPath = `${linePath} L ${getX(n - 1)} ${padTop + priceHeight} L ${getX(0)} ${padTop + priceHeight} Z`;

      // Price ticks
      const priceTicks = [0, 0.25, 0.5, 0.75, 1].map(pct => {
        const val = pricesLow + pct * priceRange;
        return { val, y: getY(val) };
      });

      return (
        <div style={{ position: 'relative' }}>
          {/* Chart Header Toolbar */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.65rem' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', fontSize: '0.78rem' }}>
              <span style={{ color: 'var(--text-muted)' }}>Date: <strong style={{ color: 'var(--text-primary)' }}>{activeCandle.time}</strong></span>
              <span style={{ color: 'var(--text-muted)' }}>O: <strong style={{ color: isUp ? 'var(--fin-pos)' : 'var(--fin-neg)' }}>₹{activeCandle.open.toFixed(2)}</strong></span>
              <span style={{ color: 'var(--text-muted)' }}>H: <strong style={{ color: 'var(--text-primary)' }}>₹{activeCandle.high.toFixed(2)}</strong></span>
              <span style={{ color: 'var(--text-muted)' }}>L: <strong style={{ color: 'var(--text-primary)' }}>₹{activeCandle.low.toFixed(2)}</strong></span>
              <span style={{ color: 'var(--text-muted)' }}>C: <strong style={{ color: isUp ? 'var(--fin-pos)' : 'var(--fin-neg)' }}>₹{activeCandle.close.toFixed(2)}</strong></span>
              <span style={{ color: 'var(--text-muted)' }}>Vol: <strong style={{ color: 'var(--text-primary)' }}>{Number(activeCandle.volume).toLocaleString('en-IN')}</strong></span>
            </div>

            <div className="segmented-control">
              <button className={`segmented-btn ${chartType === 'candlestick' ? 'active' : ''}`} onClick={() => onTypeChange('candlestick')}>Candles</button>
              <button className={`segmented-btn ${chartType === 'line' ? 'active' : ''}`} onClick={() => onTypeChange('line')}>Line</button>
              <button className={`segmented-btn ${chartType === 'bar' ? 'active' : ''}`} onClick={() => onTypeChange('bar')}>Bar</button>
            </div>
          </div>

          {/* SVG Canvas Chart */}
          <div
            ref={containerRef}
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            style={{ width: '100%', height: `${height}px`, cursor: 'crosshair', position: 'relative', overflow: 'hidden' }}
          >
            <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: '100%' }}>
              <defs>
                <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={isUp ? 'var(--fin-pos)' : 'var(--accent-gold)'} stopOpacity="0.25" />
                  <stop offset="100%" stopColor={isUp ? 'var(--fin-pos)' : 'var(--accent-gold)'} stopOpacity="0.0" />
                </linearGradient>
              </defs>

              {/* Grid lines */}
              {priceTicks.map((t, idx) => (
                <g key={idx}>
                  <line x1={padLeft} y1={t.y} x2={width - padRight} y2={t.y} stroke="var(--border-subtle)" strokeDasharray="3 3" />
                  <text x={width - padRight + 6} y={t.y + 4} fill="var(--text-muted)" fontSize="10" fontFamily="var(--font-mono)">
                    ₹{t.val.toFixed(0)}
                  </text>
                </g>
              ))}

              {/* Volume separator */}
              <line x1={padLeft} y1={volTop - 8} x2={width - padRight} y2={volTop - 8} stroke="var(--border-subtle)" />
              <text x={padLeft} y={volTop - 12} fill="var(--text-muted)" fontSize="9" fontWeight="700">VOLUME</text>

              {/* Volume Bars */}
              {candles.map((c, i) => {
                const x = getX(i);
                const barH = ((c.volume || 0) / maxVol) * volHeight;
                const y = height - 15 - barH;
                const barW = Math.max(2, step * 0.65);
                const color = c.close >= c.open ? 'var(--fin-pos)' : 'var(--fin-neg)';
                return (
                  <rect key={i} x={x - barW / 2} y={y} width={barW} height={barH} fill={color} opacity="0.45" />
                );
              })}

              {/* Line Chart Mode */}
              {chartType === 'line' && (
                <>
                  <path d={areaPath} fill="url(#lineGrad)" />
                  <path d={linePath} fill="none" stroke={isUp ? 'var(--fin-pos)' : 'var(--accent-gold)'} strokeWidth="2" strokeLinejoin="round" />
                </>
              )}

              {/* Candlestick Mode */}
              {chartType === 'candlestick' && candles.map((c, i) => {
                const x = getX(i);
                const candleUp = c.close >= c.open;
                const color = candleUp ? 'var(--fin-pos)' : 'var(--fin-neg)';
                const yOpen = getY(c.open);
                const yClose = getY(c.close);
                const yHigh = getY(c.high);
                const yLow = getY(c.low);
                const topY = Math.min(yOpen, yClose);
                const bodyH = Math.max(1.5, Math.abs(yOpen - yClose));
                const candleW = Math.max(3, step * 0.7);

                return (
                  <g key={i}>
                    {/* Wick */}
                    <line x1={x} y1={yHigh} x2={x} y2={yLow} stroke={color} strokeWidth="1.2" />
                    {/* Body */}
                    <rect x={x - candleW / 2} y={topY} width={candleW} height={bodyH} fill={color} rx="1" />
                  </g>
                );
              })}

              {/* Bar Chart Mode (OHLC) */}
              {chartType === 'bar' && candles.map((c, i) => {
                const x = getX(i);
                const candleUp = c.close >= c.open;
                const color = candleUp ? 'var(--fin-pos)' : 'var(--fin-neg)';
                const yOpen = getY(c.open);
                const yClose = getY(c.close);
                const yHigh = getY(c.high);
                const yLow = getY(c.low);
                const tickW = Math.max(2, step * 0.35);

                return (
                  <g key={i}>
                    <line x1={x} y1={yHigh} x2={x} y2={yLow} stroke={color} strokeWidth="1.2" />
                    {/* Open tick (left) */}
                    <line x1={x - tickW} y1={yOpen} x2={x} y2={yOpen} stroke={color} strokeWidth="1.2" />
                    {/* Close tick (right) */}
                    <line x1={x} y1={yClose} x2={x + tickW} y2={yClose} stroke={color} strokeWidth="1.2" />
                  </g>
                );
              })}

              {/* Interactive Crosshair */}
              {hoveredIndex !== null && (
                <g>
                  {/* Vertical line */}
                  <line
                    x1={getX(hoveredIndex)}
                    y1={padTop}
                    x2={getX(hoveredIndex)}
                    y2={height - 15}
                    stroke="var(--text-muted)"
                    strokeWidth="1"
                    strokeDasharray="2 2"
                  />
                  {/* Horizontal line */}
                  <line
                    x1={padLeft}
                    y1={getY(activeCandle.close)}
                    x2={width - padRight}
                    y2={getY(activeCandle.close)}
                    stroke="var(--text-muted)"
                    strokeWidth="1"
                    strokeDasharray="2 2"
                  />
                  {/* Price Tag badge on right axis */}
                  <rect
                    x={width - padRight + 2}
                    y={getY(activeCandle.close) - 9}
                    width={58}
                    height={18}
                    fill="var(--bg-surface-subtle)"
                    stroke="var(--border-strong)"
                    rx="2"
                  />
                  <text
                    x={width - padRight + 6}
                    y={getY(activeCandle.close) + 4}
                    fill="var(--text-primary)"
                    fontSize="10"
                    fontWeight="700"
                    fontFamily="var(--font-mono)"
                  >
                    ₹{activeCandle.close.toFixed(1)}
                  </text>
                </g>
              )}
            </svg>
          </div>
        </div>
      );
    }

      // Authoritative Financial Freedom Calculation Engine
      const freedomCalculations = useMemo(() => {
        const totalIncome = Math.max(0, Number(ffIncome.monthly_income) || 0)
          + Math.max(0, Number(ffIncome.additional_income) || 0)
          + Math.max(0, Number(ffIncome.rental_income) || 0)
          + Math.max(0, Number(ffIncome.spouse_income) || 0);

        const totalEssential = Object.values(ffEssential).reduce((a, b) => a + Math.max(0, Number(b) || 0), 0);
        const totalLifestyle = Object.values(ffLifestyle).reduce((a, b) => a + Math.max(0, Number(b) || 0), 0);
        const totalEmis = Object.values(ffEmis).reduce((a, b) => a + Math.max(0, Number(b) || 0), 0);
        const totalCustom = ffCustomExpenses.reduce((a, b) => a + Math.max(0, Number(b.amount) || 0), 0);
        const totalExpenses = totalEssential + totalLifestyle + totalEmis + totalCustom;
        const totalInvestedExisting = Object.values(ffInvestments).reduce((a, b) => a + Math.max(0, Number(b) || 0), 0);

        const monthlySurplus = totalIncome - totalExpenses;
        const monthlyObligations = totalEssential + totalEmis;
        const emergencyTarget = monthlyObligations * ffEmergencyMonths;
        const emergencyGap = Math.max(0, emergencyTarget - ffCurrentSavings);
        const emergencyReady = ffCurrentSavings >= emergencyTarget;

        let suggestedBuffer = 0;
        let safeCapacity = 0;
        if (monthlySurplus > 0) {
          let bufferPct = emergencyGap > 0 ? 0.30 : 0.20;
          if (ffRisk === 'conservative') bufferPct += 0.05;
          if (ffRisk === 'aggressive') bufferPct = Math.max(0.15, bufferPct - 0.05);

          const rawBuffer = monthlySurplus * bufferPct;
          const minBuffer = Math.min(monthlySurplus, Math.max(3000, totalIncome * 0.05));
          suggestedBuffer = Math.round(Math.max(rawBuffer, minBuffer));
          safeCapacity = Math.max(0, Math.round(monthlySurplus - suggestedBuffer));
        }

        const savingsRatePct = totalIncome > 0 ? ((monthlySurplus / totalIncome) * 100).toFixed(1) : '0.0';
        const emiBurdenPct = totalIncome > 0 ? ((totalEmis / totalIncome) * 100).toFixed(1) : '0.0';
        const emergencyMonthsToFund = emergencyReady ? 0 : (safeCapacity > 0 ? Math.ceil(emergencyGap / safeCapacity) : 999);

        // Inflation & Future Living Expense
        const inflationRateDec = Math.max(0, ffInflationRate) / 100;
        const horizon = Math.max(1, ffHorizonYears);
        const inflationFactor = Math.pow(1 + inflationRateDec, horizon);
        const futureMonthlyExpense = Math.round(ffTargetMonthlyExpense * inflationFactor);
        const futureAnnualExpense = futureMonthlyExpense * 12;

        // Freedom Corpus (Annual / Withdrawal Rate)
        const withdrawalRateDec = Math.max(0.01, ffWithdrawalRate) / 100;
        const freedomCorpus = Math.round(futureAnnualExpense / withdrawalRateDec);

        // Existing Investments Future Value (PV * (1+r)^n)
        const returnDec = Math.max(0, ffReturnAssumption) / 100;
        const growthFactor = Math.pow(1 + returnDec, horizon);
        const existingInvestmentsFv = Math.round(totalInvestedExisting * growthFactor);
        const netCorpusNeeded = Math.max(0, freedomCorpus - existingInvestmentsFv);

        // Reverse SIP Annuity Solver
        const rMonth = returnDec / 12;
        const nMonths = horizon * 12;
        let requiredSip = 0;
        let denom = 0;

        if (netCorpusNeeded === 0) {
          requiredSip = 0;
          denom = rMonth > 0 ? ((Math.pow(1 + rMonth, nMonths) - 1) / rMonth) * (1 + rMonth) : nMonths;
        } else if (rMonth <= 0) {
          denom = nMonths;
          requiredSip = Math.ceil(netCorpusNeeded / nMonths);
        } else {
          denom = ((Math.pow(1 + rMonth, nMonths) - 1) / rMonth) * (1 + rMonth);
          requiredSip = denom > 0 ? Math.ceil(netCorpusNeeded / denom) : 0;
        }

        const sipDiff = safeCapacity - requiredSip;
        const hasShortfall = requiredSip > safeCapacity;

        // Month-by-month compounding simulation for exact years/months
        let simCorpus = totalInvestedExisting;
        let freedomMonths = 0;
        let freedomFound = false;
        const maxMonths = 50 * 12;

        const targetToday = (ffTargetMonthlyExpense * 12) / withdrawalRateDec;
        if (simCorpus >= targetToday && targetToday > 0) {
          freedomMonths = 0;
          freedomFound = true;
        } else {
          for (let m = 1; m <= maxMonths; m++) {
            simCorpus = (simCorpus + safeCapacity) * (1 + rMonth);
            const tYears = m / 12;
            const expM = ffTargetMonthlyExpense * Math.pow(1 + inflationRateDec, tYears);
            const targetM = (expM * 12) / withdrawalRateDec;
            if (simCorpus >= targetM) {
              freedomMonths = m;
              freedomFound = true;
              break;
            }
          }
        }

        const estYears = Math.floor(freedomMonths / 12);
        const estMonths = freedomMonths % 12;

        // Scenario Comparison: Conservative (8%), Base (10%), Optimistic (12%)
        const scenarioList = [
          { name: 'Conservative', rate: 8, label: '8% p.a. Assumed Return', badge: 'Defensive' },
          { name: 'Base', rate: 10, label: '10% p.a. Assumed Return', badge: 'Balanced' },
          { name: 'Optimistic', rate: 12, label: '12% p.a. Assumed Return', badge: 'Growth' }
        ].map(sc => {
          const scRateDec = sc.rate / 100;
          const scRMonth = scRateDec / 12;
          const scFvExisting = totalInvestedExisting * Math.pow(1 + scRateDec, horizon);
          const scNetCorpus = Math.max(0, freedomCorpus - scFvExisting);
          const scDenom = ((Math.pow(1 + scRMonth, nMonths) - 1) / scRMonth) * (1 + scRMonth);
          const scReqSip = scNetCorpus === 0 ? 0 : Math.ceil(scNetCorpus / scDenom);
          const scFvSip = safeCapacity * scDenom;
          const scProjected = Math.round(scFvExisting + scFvSip);
          return {
            ...sc,
            requiredSip: scReqSip,
            projectedCorpus: scProjected,
            corpus: freedomCorpus
          };
        });

        // Readiness Score (0-100)
        const efMonthsRatio = monthlyObligations > 0 ? (ffCurrentSavings / monthlyObligations) : 12;
        const scoreEmergency = Math.min(25, (efMonthsRatio / 6) * 25);

        else if (emiPctNum <= 45) scoreDebt = 12;
        else if (emiPctNum <= 60) scoreDebt = 5;
        else scoreDebt = 0;

        const scoreSavings = Math.min(20, Math.max(0, (Number(savingsRatePct) / 35) * 20));
        const capRatio = requiredSip > 0 ? (safeCapacity / requiredSip) : 1.0;
        const scoreCapacity = Math.min(20, Math.max(0, capRatio * 20));
        const scoreHorizon = Math.min(10, Math.max(2, (horizon / 10) * 10));

        const readinessScore = Math.max(5, Math.min(98, Math.round(scoreEmergency + scoreDebt + scoreSavings + scoreCapacity + scoreHorizon)));
        let scoreCategory = 'Starting';
        let scoreColor = 'var(--fin-amber)';

        if (readinessScore >= 80) {

          scoreSummary = 'Solid financial fundamentals; reinforcing your emergency cushion and sustaining monthly contributions will accelerate your milestone.';
        } else if (readinessScore >= 40) {
          scoreCategory = 'Building';
          scoreColor = 'var(--fin-blue)';
          scoreSummary = 'Active surplus and investment intent. Moderating discretionary spending and growing your safety reserve will boost overall resilience.';
        }

        return {
          totalIncome,
          totalEssential,
          totalLifestyle,
          totalEmis,
          totalCustom,
          totalExpenses,
          totalInvestedExisting,
          monthlySurplus,
          monthlyObligations,
          emergencyTarget,
          emergencyGap,
          emergencyReady,
          emergencyMonthsToFund,
          suggestedBuffer,
          safeCapacity,
          savingsRatePct,
          emiBurdenPct,
          futureMonthlyExpense,
          futureAnnualExpense,
          freedomCorpus,
          existingInvestmentsFv,
          netCorpusNeeded,
          requiredSip,
          sipDiff,
          hasShortfall,
          freedomFound,
          estYears,
          estMonths,
          scenarioList,
          readinessScore,
          scoreCategory,
          scoreColor,
          scoreSummary,
          scoreBreakdown: {
            emergency: Math.round(scoreEmergency),
            debt: Math.round(scoreDebt),
            savings: Math.round(scoreSavings),
            capacity: Math.round(scoreCapacity),
            horizon: Math.round(scoreHorizon)

        for (let i = 0; i < count; i++) {

          const o = Math.round(curr * 100) / 100;
          const c = Math.round((curr + change) * 100) / 100;

      // 14. WHAT-IF LAB (Scenario Simulation & Stress Testing)
      const renderWhatIfLab = () => {
        // Calculations for active scenario
        let result = {};
        if (whatIfScenario === 'stepup') {
          // Compare normal SIP vs Step-up SIP
          const r = 0.12 / 12;
          const months = whatIfYears * 12;
          // Normal SIP
          const normalInvested = whatIfBaseSip * months;
          const normalCorpus = whatIfBaseSip * ((Math.pow(1 + r, months) - 1) / r) * (1 + r);
          
          // Step-up SIP (increases by whatIfStepUpPct each year)
          let stepInvested = 0;
          let stepCorpus = 0;
          let curSip = whatIfBaseSip;
          for (let y = 0; y < whatIfYears; y++) {
            for (let m = 0; m < 12; m++) {
              stepInvested += curSip;
              const remainingMonths = months - (y * 12 + m);
              stepCorpus += curSip * Math.pow(1 + r, remainingMonths);
            }
            curSip = curSip * (1 + whatIfStepUpPct / 100);
          }
          const extraWealth = stepCorpus - normalCorpus;
          result = {
            baseInvested: normalInvested,
            baseCorpus: Math.round(normalCorpus),
            stepInvested: Math.round(stepInvested),
            stepCorpus: Math.round(stepCorpus),
            extraWealth: Math.round(extraWealth),
            stepMultiplier: (stepCorpus / normalCorpus).toFixed(2),
          };
        } else if (whatIfScenario === 'crash') {
          // 20% Drop Stress Test
          const basePortfolio = 1000000;
          const postCrash = basePortfolio * 0.80;
          const panicSellLoss = basePortfolio * 0.20;
          const sipBuyingUnitsGain = 25; // 25% more units per SIP
          const recoveryMonths = 14;
          result = {
            basePortfolio,
            postCrash,
            panicSellLoss,
            sipBuyingUnitsGain,
            recoveryMonths,
            breakEvenTime: '14–18 Months',
          };
        } else if (whatIfScenario === 'delay') {
          // Delay by 3 years
          const r = 0.12 / 12;
          const totalMonths = whatIfYears * 12;

                <div className="brand-title">FinPilot AI</div>
                <span className="brand-tagline">Your AI Wealth Mentor</span>
              </div>
            </div>

            <div className="sidebar-scroll">
              <div className="sidebar-section-title">Navigation</div>
              <button className={`nav-btn ${activeView === 'overview' ? 'active' : ''}`} onClick={() => setActiveView('overview')}>
                <Icons.Overview /> <span>Overview</span>
              </button>

              <div className="sidebar-section-title">Education</div>
              <button className={`nav-btn ${activeView === 'learn' ? 'active' : ''}`} onClick={() => setActiveView('learn')}>
                <Icons.Learn /> <span>Learn Mode</span>
                <span className="nav-badge">{completedLessons.length}/8</span>
              </button>
              <button className={`nav-btn ${activeView === 'tutor' ? 'active' : ''}`} onClick={() => setActiveView('tutor')}>
                <Icons.Tutor /> <span>AI Financial Tutor</span>
              </button>
              <button className={`nav-btn ${activeView === 'iq' ? 'active' : ''}`} onClick={() => setActiveView('iq')}>
                <Icons.IQ /> <span>Financial IQ</span>
                <span className="nav-badge" style={{ color: 'var(--accent-gold)' }}>{user.financial_iq}</span>
              </button>
              <button className={`nav-btn ${activeView === 'profile' ? 'active' : ''}`} onClick={() => setActiveView('profile')}>
                <Icons.Profile /> <span>Financial Profile</span>
              </button>

              <div className="sidebar-section-title">AI Planning</div>
              <button className={`nav-btn ${activeView === 'advisor' ? 'active' : ''}`} onClick={() => setActiveView('advisor')}>
                <Icons.Advisor /> <span>AI Wealth Advisor</span>
              </button>
              <button className={`nav-btn ${activeView === 'freedom' ? 'active' : ''}`} onClick={() => setActiveView('freedom')}>
                <Icons.Freedom /> <span>Financial Freedom</span>
                <span className="nav-badge" style={{ backgroundColor: 'var(--accent-gold)', color: '#000', fontWeight: 800, fontSize: '0.62rem', letterSpacing: '0.04em' }}>FLAGSHIP</span>
              </button>
              <button className={`nav-btn ${activeView === 'goals' ? 'active' : ''}`} onClick={() => setActiveView('goals')}>
                <Icons.Goals /> <span>Goals</span>
              </button>
              <button className={`nav-btn ${activeView === 'simulator' ? 'active' : ''}`} onClick={() => setActiveView('simulator')}>
                <Icons.Simulator /> <span>Wealth Simulator</span>
              </button>

              <div className="sidebar-section-title">Markets & Research</div>
              <button className={`nav-btn ${activeView === 'markets' ? 'active' : ''}`} onClick={() => setActiveView('markets')}>
                <Icons.Markets /> <span>Markets</span>
              </button>
              <button className={`nav-btn ${activeView === 'stocks' ? 'active' : ''}`} onClick={() => setActiveView('stocks')}>
                <Icons.Stocks /> <span>Stock Detail</span>
              </button>
              <button className={`nav-btn ${activeView === 'recommended' ? 'active' : ''}`} onClick={() => setActiveView('recommended')}>
                <Icons.Stocks /> <span>Recommended Stocks</span>
              </button>
              <button className={`nav-btn ${activeView === 'mutualfunds' ? 'active' : ''}`} onClick={() => setActiveView('mutualfunds')}>
                <Icons.MutualFunds /> <span>Mutual Funds</span>
              </button>

              <div className="sidebar-section-title">Execution & Tools</div>
              <button className={`nav-btn ${activeView === 'portfolio' ? 'active' : ''}`} onClick={() => setActiveView('portfolio')}>
                <Icons.Portfolio /> <span>My Portfolio</span>
              </button>
              <button className={`nav-btn ${activeView === 'guardian' ? 'active' : ''}`} onClick={() => setActiveView('guardian')}>
                <Icons.Guardian /> <span>Portfolio Guardian</span>
              </button>

              <div className="sidebar-section-title">System</div>
              <button className={`nav-btn ${activeView === 'settings' ? 'active' : ''}`} onClick={() => setActiveView('settings')}>
                <Icons.Settings /> <span>Settings</span>
              </button>
            </div>

            {/* Sidebar Status & Mode Switcher */}
            <div className="sidebar-mode-box">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.45rem' }}>
                <span style={{ fontSize: '0.68rem', color: 'var(--text-muted)', textTransform: 'uppercase', fontWeight: 700 }}>Planning Mode</span>
                <span 
                  onClick={() => handleModeChange(planningMode === 'guide' ? 'solo' : 'guide')}
                  style={{ fontSize: '0.68rem', color: 'var(--accent-gold)', cursor: 'pointer', fontWeight: 600 }}
                  title="Switch Planning Mode"
                >
                  Switch ⇄
                </span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', fontWeight: 700, fontSize: '0.82rem', color: planningMode === 'guide' ? 'var(--accent-gold)' : 'var(--fin-blue)' }}>
                <span className="mode-dot" style={{ backgroundColor: planningMode === 'guide' ? 'var(--accent-gold)' : 'var(--fin-blue)' }}></span>
                <span>{planningMode === 'guide' ? 'Guide Mode' : 'Solo Mode'}</span>
                <span style={{ fontSize: '0.68rem', fontWeight: 500, color: 'var(--text-muted)' }}>
                  ({planningMode === 'guide' ? 'AI-Assisted' : 'Independent'})
                </span>
              </div>

              <div style={{ marginTop: '0.6rem', paddingTop: '0.5rem', borderTop: '1px solid var(--border-subtle)', display: 'flex', justifyContent: 'space-between', fontSize: '0.72rem' }}>
                <div>
                  <span style={{ color: 'var(--text-muted)' }}>Financial IQ: </span>
                  <strong className="num" style={{ color: 'var(--accent-gold)' }}>{financialIq}</strong>
                </div>
                <div>
                  <span style={{ color: 'var(--text-muted)' }}>Risk: </span>
                  <strong style={{ textTransform: 'capitalize' }}>{profileForm.risk}</strong>
                </div>
              </div>
            </div>

            {/* Sidebar User Footer */}
            <div className="sidebar-footer">
              <div className="user-pill" onClick={() => !token ? setShowAuthModal(true) : setActiveView('profile')}>
                <div className="user-avatar">{user.name.charAt(0)}</div>
                <div>
                  <div className="user-name">{user.name}</div>
                  <div style={{ fontSize: '0.68rem', color: 'var(--text-muted)' }}>
                    {token ? 'Pro Account' : 'Guest Mode'}
                  </div>
                </div>
              </div>
              {token ? (
                <button onClick={handleSignout} style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                  Exit
                </button>
              ) : (
                <button className="btn btn-gold btn-sm" onClick={() => setShowAuthModal(true)}>
                  Sign In
                </button>
              )}
            </div>
          </aside>

          {/* 2. MARKET WATCHLIST (Column 2 - Collapsible) */}
          <section className={`watchlist-col ${watchlistCollapsed ? 'collapsed' : ''}`}>
            <div className="watchlist-header">
              <div className="watchlist-title">
                <span>Watchlist</span>
                <span style={{ fontSize: '0.68rem', color: 'var(--accent-gold)', fontWeight: 700 }}>
                  ({filteredWatchlist.length})
                </span>
              </div>
              <button
                className="topbar-btn-toggle"
                onClick={() => setWatchlistCollapsed(true)}
                title="Collapse Watchlist"
                style={{ padding: '2px 6px' }}
              >
                ◀
              </button>
            </div>

            {/* Watchlist Search */}
            <div className="watchlist-search-box">
              <span className="watchlist-search-icon"><Icons.Search /></span>
              <input
                className="watchlist-search-input"
                placeholder="Search stocks, ETFs, indices..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
              />
            </div>

            {/* Watchlist Items */}
            <div className="watchlist-items">
              {filteredWatchlist.map(stock => {
                const isSelected = selectedStockSymbol === stock.symbol;
                const isPos = stock.change >= 0;
                return (
                  <div
                    key={stock.symbol}
                    className={`watchlist-item ${isSelected ? 'selected' : ''}`}
                    onClick={() => handleSelectStock(stock.symbol)}
                  >
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                      <span className="watchlist-item-sym">{stock.symbol}</span>
                      <span className="watchlist-item-price num">₹{stock.price.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '2px' }}>
                      <span className="watchlist-item-name">{stock.name}</span>
                      <span className={`tabular ${isPos ? 'pos' : 'neg'}`} style={{ fontSize: '0.72rem', fontWeight: 600 }}>
                        {isPos ? '+' : ''}{stock.change_percent}%
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* 3. MAIN CONTENT */}
          <main className={`main-wrap ${watchlistCollapsed ? 'watchlist-collapsed' : ''}`}>
            {/* Topbar */}
            <header className="topbar">
              <div className="topbar-left">
                {watchlistCollapsed && (
                  <button
                    className="topbar-btn-toggle"
                    onClick={() => setWatchlistCollapsed(false)}
                    title="Expand Watchlist"
                  >
                    ▶ Watchlist
                  </button>
                )}
                <div className="topbar-title">
                  FinPilot AI <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem', fontWeight: 500 }}>/ {activeView.toUpperCase()}</span>
                </div>
              </div>

              <div className="topbar-right">
                <span className={`market-status-badge ${marketStatus.is_open ? 'status-open' : 'status-closed'}`}>
                  <span className="status-dot"></span> {marketStatus.status}
                </span>

                <div 
                  className={`mode-indicator-pill ${planningMode === 'guide' ? 'mode-guide' : 'mode-solo'}`}
                  onClick={() => handleModeChange(planningMode === 'guide' ? 'solo' : 'guide')}
                  title="Click to switch Planning Style: Guide Mode vs Solo Mode"
                >
                  <span className="mode-dot"></span>
                  <span style={{ fontWeight: 700 }}>{planningMode === 'guide' ? 'GUIDE MODE' : 'SOLO MODE'}</span>
                  <span style={{ fontSize: '0.68rem', opacity: 0.8 }}>
                    {planningMode === 'guide' ? 'AI-Assisted' : 'Independent'}
                  </span>
                  <span style={{ fontSize: '0.72rem', opacity: 0.8, marginLeft: '2px' }}>⇄</span>
                </div>

                <div className="iq-chip" onClick={() => setActiveView('iq')} title="Financial IQ Level">
                  <span>⟡</span> IQ {financialIq}
                </div>

                <button className="theme-toggle-btn" onClick={toggleTheme} title="Toggle Theme">
                  {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
                </button>
              </div>
            </header>

            {/* Main Content View */}
            <div className="main-body">
              {renderContent()}
            </div>
          </main>

          {/* MODAL: "Explain This Stock" */}
          {showExplainModal && stockExplainer && (
            <div className="modal-overlay" onClick={() => setShowExplainModal(false)}>
              <div className="modal-card" onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                  <div>
                    <div style={{ fontWeight: 800, fontSize: '1.05rem', color: 'var(--text-primary)' }}>
                      FinPilot Explainer: {stockExplainer.name} ({stockExplainer.symbol})
                    </div>
                    <div style={{ fontSize: '0.74rem', color: 'var(--text-muted)' }}>Plain-English business breakdown for wealth builders</div>
                  </div>
                  <button onClick={() => setShowExplainModal(false)} style={{ fontSize: '1.2rem', color: 'var(--text-muted)' }}>✕</button>
                </div>

                <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: '0.84rem', color: 'var(--accent-gold)', marginBottom: '0.2rem' }}>
                      1. What does this company do?
                    </div>
                    <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                      {stockExplainer.what_they_do}
                    </p>
                  </div>

                  <div>
                    <div style={{ fontWeight: 700, fontSize: '0.84rem', color: 'var(--accent-gold)', marginBottom: '0.2rem' }}>
                      2. How does it make money?
                    </div>
                    <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                      {stockExplainer.how_they_make_money}
                    </p>
                  </div>

                  <div>
                    <div style={{ fontWeight: 700, fontSize: '0.84rem', color: 'var(--accent-gold)', marginBottom: '0.2rem' }}>
                      3. Key Growth Drivers
                    </div>
                    <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                      {stockExplainer.growth_drivers}
                    </p>
                  </div>

                  <div>
                    <div style={{ fontWeight: 700, fontSize: '0.84rem', color: 'var(--fin-neg)', marginBottom: '0.2rem' }}>
                      4. Major Risks to Understand
                    </div>
                    <p style={{ fontSize: '0.82rem', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                      {stockExplainer.major_risks}
                    </p>
                  </div>

                  <div style={{ background: 'var(--bg-surface-elevated)', padding: '0.85rem', borderRadius: 'var(--radius-md)' }}>
                    <div style={{ fontWeight: 700, fontSize: '0.84rem', color: 'var(--text-primary)', marginBottom: '0.2rem' }}>
                      💡 What should a beginner understand?
                    </div>
                    <p style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', lineHeight: '1.5' }}>
                      {stockExplainer.beginner_takeaway}
                    </p>
                  </div>
                </div>

                <div className="modal-foot">
                  <button className="btn btn-gold btn-sm" onClick={() => setShowExplainModal(false)}>
                    Understood ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: "What is this metric?" Helper */}
          {activeHelperMetric && (
            <div className="modal-overlay" onClick={() => setActiveHelperMetric(null)}>
              <div className="modal-card" style={{ maxWidth: '420px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                  <div style={{ fontWeight: 800, fontSize: '0.98rem' }}>
                    Understanding {activeHelperMetric.label}
                  </div>
                  <button onClick={() => setActiveHelperMetric(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--accent-gold)', marginBottom: '0.5rem' }} className="num">
                    {activeHelperMetric.val}
                  </div>
                  <p style={{ fontSize: '0.84rem', color: 'var(--text-secondary)', lineHeight: '1.6' }}>
                    {activeHelperMetric.desc}
                  </p>
                </div>
                <div className="modal-foot">
                  <button className="btn btn-gold btn-sm" onClick={() => setActiveHelperMetric(null)}>Got it</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Auth (Sign In / Register) */}
          {showAuthModal && (
            <div className="modal-overlay" onClick={() => setShowAuthModal(false)}>
              <div className="modal-card" style={{ maxWidth: '400px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                  <div style={{ fontWeight: 800, fontSize: '1rem' }}>
                    {authMode === 'signin' ? 'Sign In to FinPilot AI' : 'Create Your Account'}
                  </div>
                  <button onClick={() => setShowAuthModal(false)}>✕</button>
                </div>

                <form onSubmit={handleAuthSubmit}>
                  <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                    {authError && <div className="fin-alert fin-alert-gold">{authError}</div>}

                    {authMode === 'signup' && (
                      <div>
                        <label className="form-label">Full Name</label>
                        <input className="form-input" required value={authName} onChange={e => setAuthName(e.target.value)} placeholder="Arjun Sharma" />
                      </div>
                    )}
                    <div>
                      <label className="form-label">Email Address</label>
                      <input className="form-input" type="email" required value={authEmail} onChange={e => setAuthEmail(e.target.value)} placeholder="arjun@example.com" />
                    </div>
                    <div>
                      <label className="form-label">Password</label>
                      <input className="form-input" type="password" required value={authPass} onChange={e => setAuthPass(e.target.value)} placeholder="••••••••" />
                    </div>
                  </div>

                  <div className="modal-foot" style={{ justifyContent: 'space-between', alignItems: 'center' }}>
                    <button
                      type="button"
                      style={{ fontSize: '0.75rem', color: 'var(--accent-gold)', textDecoration: 'underline' }}
                      onClick={() => { setAuthMode(authMode === 'signin' ? 'signup' : 'signin'); setAuthError(''); }}
                    >
                      {authMode === 'signin' ? 'Need an account? Sign up' : 'Already have an account? Sign in'}
                    </button>
                    <button type="submit" className="btn btn-gold">
                      {authMode === 'signin' ? 'Sign In' : 'Create Account'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: Real Market API Gateway Health Dashboard */}
          {showApiHealthModal && (
            <div className="modal-overlay" onClick={() => setShowApiHealthModal(false)}>
              <div className="modal-card" style={{ maxWidth: '560px' }} onClick={e => e.stopPropagation()}>
                <div className="modal-head">
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <span style={{ fontSize: '1.2rem' }}>⚡</span>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: '1.05rem' }}>Market Data Gateway Health</div>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Real-time verification of Kite Connect & Alpha Vantage integrations</div>
                    </div>
                  </div>
                  <button onClick={() => setShowApiHealthModal(false)}>✕</button>
                </div>

                <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  {/* Alpha Vantage Status Card */}
                  <div style={{ padding: '0.85rem 1rem', background: 'var(--bg-surface-elevated)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-subtle)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.4rem' }}>
                      <div style={{ fontWeight: 700, fontSize: '0.88rem' }}>Alpha Vantage API</div>
                      <span className={`badge ${apiHealth?.services?.alpha_vantage?.connected ? 'badge-success' : 'badge-gold'}`}>
                        {apiHealth?.services?.alpha_vantage?.status || 'CONNECTED'}
                      </span>
                    </div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>
                      {apiHealth?.services?.alpha_vantage?.message || 'Alpha Vantage connected. Powers global quotes, company fundamentals, and technical momentum indicators.'}
                    </div>
                    <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)', marginTop: '0.35rem' }}>
                      Key: {apiHealth?.services?.alpha_vantage?.api_key_suffix || '...636L'} · Gateway: Active
                    </div>
                  </div>

                  {/* Zerodha Kite Connect Status Card */}
                  <div style={{ padding: '0.85rem 1rem', background: 'var(--bg-surface-elevated)', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-subtle)' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.4rem' }}>
                      <div style={{ fontWeight: 700, fontSize: '0.88rem' }}>Zerodha Kite Connect</div>
                      <span className={`badge ${apiHealth?.services?.kite_connect?.connected ? 'badge-success' : 'badge-gold'}`}>
                        {apiHealth?.services?.kite_connect?.connected ? 'CONNECTED' : 'AUTH REQUIRED'}
                      </span>
                    </div>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>
                      {apiHealth?.services?.kite_connect?.message || 'Kite instruments catalog cached (113,000+ contracts). Daily access token required for live authenticated order/quote feed.'}
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.5rem' }}>
                      <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                        Key: {apiHealth?.services?.kite_connect?.api_key_suffix || '...wtao'} · Reason: {apiHealth?.services?.kite_connect?.reason || 'KITE_ACCESS_TOKEN_REQUIRED'}
                      </span>
                      {apiHealth?.services?.kite_connect?.login_url && (
                        <a
                          href={apiHealth.services.kite_connect.login_url}
                          target="_blank"
                          rel="noreferrer"
                          className="btn btn-outline btn-sm"
                          style={{ fontSize: '0.72rem', padding: '2px 8px' }}
                        >
                          Zerodha Login ↗
                        </a>
                      )}
                    </div>
                  </div>

                  {/* Database & Stream Status */}
                  <div className="grid-2" style={{ gap: '0.75rem' }}>
                    <div style={{ padding: '0.75rem', background: 'var(--bg-surface-elevated)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)' }}>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Database Persistence</div>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem', color: 'var(--fin-pos)', marginTop: '2px' }}>
                        ● SQLite Operational
                      </div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '2px' }}>
                        Local storage & user records active
                      </div>
                    </div>

                    <div style={{ padding: '0.75rem', background: 'var(--bg-surface-elevated)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-subtle)' }}>
                      <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>Market Tick Stream</div>
                      <div style={{ fontWeight: 700, fontSize: '0.85rem', color: 'var(--fin-pos)', marginTop: '2px' }}>
                        ● SSE Gateway Active
                      </div>
                      <div style={{ fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '2px' }}>
                        Zero aggressive browser polling
                      </div>
                    </div>
                  </div>
                </div>

                <div className="modal-foot" style={{ justifyContent: 'space-between', alignItems: 'center' }}>
                  <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                    FinPilot API Gateway · FastAPI + Python Backend
                  </span>
                  <button className="btn btn-gold btn-sm" onClick={() => setShowApiHealthModal(false)}>
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
